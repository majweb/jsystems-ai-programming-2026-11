/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const tx = v => (v && typeof v === "object" && !Array.isArray(v)) ? v[LANG] : v;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function segs(el, items, active, onPick){
  el.innerHTML = "";
  items.forEach(([key,label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "seg"; b.textContent = label;
    b.setAttribute("aria-pressed", key === active ? "true" : "false");
    b.addEventListener("click", () => { [...el.children].forEach(c => c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); onPick(key); });
    el.appendChild(b);
  });
}
function legend(el, items){ el.innerHTML = items.map(([c,l]) => `<span><i style="background:${c}"></i>${l}</span>`).join(""); }
function baseOpts(axisMax){
  const ink = css("--muted"), grid = css("--line");
  return {indexAxis:"y", responsive:true, maintainAspectRatio:false, animation:{duration:300},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${nf(c.raw, c.raw % 1 ? 2 : 0)}`}}},
    scales:{x:{min:0,max:axisMax,grid:{color:grid},ticks:{color:ink,font:{family:"IBM Plex Mono",size:11}}},
            y:{grid:{display:false},ticks:{color:css("--ink"),font:{family:"IBM Plex Sans",size:12}}}}};
}

/* ---------- 01 gap explorer ---------- */
let gapChart, gapKey = "lek", gapLang = "RU";
const gapSel = $("gapLang");
GAP.mmluprox.langs.forEach(l => { const o = document.createElement("option"); o.value = l; o.textContent = T.langs[l]; gapSel.appendChild(o); });
gapSel.value = gapLang;
gapSel.addEventListener("change", () => { gapLang = gapSel.value; drawGap(); });
function drawGap(){
  const d = GAP[gapKey];
  $("gapLangWrap").hidden = !d.multi;
  let labels, a, b, nameA, nameB, h;
  if (d.single){
    labels = d.rows.map(r => T.langs[r[0]]); a = d.rows.map(r => r[1]);
    legend($("gapLegend"), [[css("--en"),T.langs.EN],[css("--pl"),LANG==="pl"?"języki słowiańskie":"Slavic languages"]]);
  } else if (d.multi){
    const m = Object.keys(d.data); labels = m;
    a = m.map(k => d.data[k][gapLang]); b = m.map(k => d.data[k].EN);
    nameA = T.langs[gapLang]; nameB = T.en;
    legend($("gapLegend"), [[css("--pl"),nameA],[css("--en"),nameB]]);
  } else {
    labels = d.rows.map(r => r[0]); a = d.rows.map(r => r[1]); b = d.rows.map(r => r[2]);
    nameA = T.langs[d.target]; nameB = T.en;
    legend($("gapLegend"), [[css("--pl"),nameA],[css("--en"),nameB]]);
  }
  const datasets = d.single
    ? [{label:"", data:a, backgroundColor:d.rows.map(r => r[0]==="EN" ? css("--en") : css("--pl")), borderRadius:2, barThickness:18}]
    : [{label:nameA, data:a, backgroundColor:css("--pl"), borderRadius:2, barThickness:12},
       {label:nameB, data:b, backgroundColor:css("--en"), borderRadius:2, barThickness:12}];
  h = Math.max(220, labels.length * (d.single ? 34 : 40) + 50);
  $("gapBox").style.height = h + "px";
  if (gapChart) gapChart.destroy();
  const opts = baseOpts(100);
  if (!d.single) opts.plugins.tooltip.callbacks.afterBody = items => { const i = items[0].dataIndex; return `${T.gapLbl}: ${nf(a[i]-b[i],2)} pp`; };
  gapChart = new Chart($("gapChart"), {type:"bar", data:{labels, datasets}, options:opts});
  $("gapNote").textContent = tx(d.note); $("gapSrc").textContent = d.src;
}
segs($("gapTabs"), Object.entries(GAP).map(([k,v]) => [k, tx(v.name)]), gapKey, k => { gapKey = k; drawGap(); });

/* ---------- 02 heatmap ---------- */
let heatMode = "gap";
function drawHeat(){
  const cols = BELEBELE.cols;
  const acc = css("--pl"), en = css("--en");
  let html = `<thead><tr><th>Model</th>${cols.map(c => `<th title="${T.langs[c]}">${c}</th>`).join("")}</tr></thead><tbody>`;
  BELEBELE.rows.forEach(([m, v]) => {
    html += `<tr><td>${m}</td>`;
    v.forEach((x, i) => {
      const g = x - v[0];
      let bg = "transparent", shown;
      if (i === 0){ bg = `color-mix(in srgb, ${en} 22%, transparent)`; shown = nf(x); }
      else { const k = Math.min(1, Math.abs(g) / 40); bg = `color-mix(in srgb, ${acc} ${Math.round(8 + k*72)}%, transparent)`; shown = heatMode === "gap" ? nf(g) : nf(x); }
      html += `<td class="v" style="background:${bg}" title="${T.langs[cols[i]]}: ${nf(x)} (${nf(g)} pp)">${shown}</td>`;
    });
    html += "</tr>";
  });
  $("heat").innerHTML = html + "</tbody>";
}
segs($("heatMode"), [["gap",T.heatGap],["score",T.heatScore]], heatMode, k => { heatMode = k; drawHeat(); });

function drawLBFilter(){
  const el = $("lbFilter"); el.innerHTML = "";
  [["c",T.com],["o",T.open],["p",T.plm]].forEach(([k,l]) => {

  });
}
segs($("lbTabs"), Object.entries(LB).map(([k,v]) => [k, tx(v.name)]), lbKey, k => { lbKey = k; drawLB(); });

/* ---------- 04 exams ---------- */
function drawExams(){
  $("exam").innerHTML = EXAMS.map(e => {
    const ok = e.thr == null ? null : e.pl >= e.thr;
    const status = ok == null ? "" : `<span class="${ok ? "pass" : "fail"}">${ok ? T.passed : T.failed}</span>`;
    const enBar = e.en != null ? `<span style="width:${e.en}%;background:var(--en);opacity:.55;top:9px"></span>` : "";
    return `<div class="exam-row"><div class="lbl">${tx(e.l)}<small>${tx(e.s)}${status ? " · " + status : ""}</small></div>
      <div class="bar"><span style="width:${e.pl}%;background:var(--pl);${e.en != null ? "bottom:8px" : ""}"></span>${enBar}${e.thr != null ? `<i class="thr" style="left:${e.thr}%"></i>` : ""}</div>
      <div class="val">${nf(e.pl)}${e.en != null ? `<br><span style="color:var(--en)">${nf(e.en)}</span>` : ""}</div></div>`;
  }).join("");
}

/* ---------- 05 tokens ---------- */
const tkSel = $("tkLang");
Object.keys(TOK.slavic).forEach(l => { const o = document.createElement("option"); o.value = l; o.textContent = `${T.langs[l]} (${nf(TOK.slavic[l],2)}×)`; tkSel.appendChild(o); });
tkSel.value = "PL";
function calc(){
  const n = Math.max(0, +$("tkIn").value || 0), p = Math.max(0, +$("tkPrice").value || 0), r = TOK.slavic[tkSel.value];
  const enCost = n / 1e6 * p, tCost = n * r / 1e6 * p;
  const usd = v => new Intl.NumberFormat(LANG, {style:"currency", currency:"USD", maximumFractionDigits:2}).format(v);
  $("tkOut").innerHTML = `<div><small>${T.tkOutTok}</small><b>${ni(n*r)}</b></div>
    <div><small>${T.tkOutCost}</small><b>${usd(tCost)}</b><small>EN: ${usd(enCost)}</small></div>
    <div><small>${T.tkOutExtra}</small><b style="color:var(--accent)">+${usd(tCost-enCost)}</b></div>
    <div><small>${T.tkOutCtx}</small><b>${nf(100/r,0)}%</b></div>`;
}
["tkIn","tkPrice"].forEach(id => $(id).addEventListener("input", calc));
tkSel.addEventListener("change", () => { calc(); if (tkKey === "slavic") drawTok(); });
let tkChart, tkKey = "slavic";
function drawTok(){
  let labels, datasets, max;
  if (tkKey === "slavic"){
    const e = Object.entries(TOK.slavic).sort((x,y) => x[1]-y[1]);
    labels = e.map(([k]) => T.langs[k]);
    datasets = [{label:"× EN", data:e.map(([,v]) => v), backgroundColor:e.map(([k]) => k === tkSel.value ? css("--pl") : css("--c-open")), borderRadius:2, barThickness:16}];
    max = 3.2; $("tkNote").textContent = T.tkNoteA; $("tkSrc").textContent = "Petrov et al. 2023 (NeurIPS) · tokenization_lengths_validated.csv · V";
  } else if (tkKey === "tok"){
    labels = TOK.tokenizers.map(r => r[0]);
    datasets = [{label:"PL/EN", data:TOK.tokenizers.map(r => r[1]), backgroundColor:css("--pl"), borderRadius:2, barThickness:16}];
    max = 3; $("tkNote").textContent = T.tkNoteB; $("tkSrc").textContent = "Petrov et al. 2023 · FLORES-200 · V";
  } else {
    labels = TOK.tpw.map(r => r[0]);
    datasets = [{label:T.langs.PL, data:TOK.tpw.map(r => r[1]), backgroundColor:css("--pl"), borderRadius:2, barThickness:12},
                {label:T.langs.EN, data:TOK.tpw.map(r => r[2]), backgroundColor:css("--en"), borderRadius:2, barThickness:12}];
    max = 3.5; $("tkNote").textContent = T.tkNoteC; $("tkSrc").textContent = "arXiv 2604.10799, Table 1 · SELF, V";
  }
  $("tkBox").style.height = Math.max(220, labels.length * (tkKey === "tpw" ? 40 : 30) + 50) + "px";
  if (tkChart) tkChart.destroy();
  const o = baseOpts(max); o.plugins.tooltip.callbacks.label = c => `${c.dataset.label}: ${nf(c.raw,2)}`;
  tkChart = new Chart($("tkChart"), {type:"bar", data:{labels, datasets}, options:o});
}
segs($("tkTabs"), [["slavic",T.tkSlavic],["tok",T.tkTok],["tpw",T.tkTpw]], tkKey, k => { tkKey = k; drawTok(); });

/* ---------- 06 cards, 07 method ---------- */
const tagLbl = {myth:LANG==="pl"?"Mit":"Myth", fact:LANG==="pl"?"Fakt":"Fact", gap:LANG==="pl"?"Luka":"Gap"};
$("cards").innerHTML = CARDS.map(([t,h,b]) => `<div class="card"><span class="tag ${t}">${tagLbl[t]}</span><h3>${h}</h3><p class="note">${b}</p></div>`).join("");
$("steps").innerHTML = T.steps.map(([h,b]) => `<div class="step"><b>${h}</b><p class="note">${b}</p></div>`).join("");
$("srcTable").innerHTML = `<thead><tr>${T.srcH.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
  SOURCES.map(([id,u,w,s]) => `<tr><td><a href="${u}" target="_blank" rel="noopener">${id}</a></td><td style="text-align:left;white-space:normal">${tx(w)}</td><td><span class="badge ${s}">${s}</span></td></tr>`).join("") + "</tbody>";

/* ---------- render + theme sync ---------- */
function renderAll(){ drawGap(); drawHeat(); drawLBFilter(); drawLB(); drawExams(); drawTok(); calc(); }
if (window.Chart){ Chart.defaults.font.family = "IBM Plex Sans"; renderAll(); }
else { drawHeat(); drawExams(); calc(); }
const rerender = () => { if (window.Chart) renderAll(); };
try { document.fonts.ready.then(rerender); } catch(e) {}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender); } catch(e) {}
new MutationObserver(rerender).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
</script>
